<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Pod · Sign in</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #eee; }
    form { display: grid; gap: 12px; width: min(320px, 90vw); }
    input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #333; background: #1b1b1b; color: inherit; }
    button { background: #6d4aff; border-color: #6d4aff; cursor: pointer; }
    .error { color: #ff7b7b; font-size: 14px; display: none; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1 style="margin:0;font-size:20px">Claude Pod</h1>
    <input type="password" name="password" placeholder="Password" autofocus required autocomplete="current-password">
    <div class="error" id="error">Wrong password.</div>
    <button type="submit">Sign in</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).has("error")) document.getElementById("error").style.display = "block";
  </script>
</body>
</html>
