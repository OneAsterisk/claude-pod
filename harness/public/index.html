<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Pod</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <strong>Claude Pod</strong>
    <nav>
      <button data-view="sessions" class="active">Sessions</button>
      <button data-view="worktrees">Worktrees</button>
    </nav>
    <form method="post" action="/logout"><button class="link">Sign out</button></form>
  </header>

  <main>
    <!-- Sessions view -->
    <section id="view-sessions" class="split">
      <aside>
        <div class="toolbar">
          <select id="repo-filter"><option value="">All repos</option></select>
          <button id="new-session-btn" class="primary">New session</button>
        </div>
        <ul id="session-list" class="list"></ul>
      </aside>

      <article id="thread">
        <div class="empty">Pick a session or start a new one.</div>
      </article>
    </section>

    <!-- Worktrees view -->
    <section id="view-worktrees" hidden>
      <div class="toolbar">
        <select id="wt-repo"></select>
        <input id="wt-name" placeholder="worktree name, e.g. con-1234-banner">
        <input id="wt-base" placeholder="base (default origin/HEAD)">
        <button id="wt-add" class="primary">Add worktree</button>
      </div>
      <div id="worktree-list"></div>
    </section>
  </main>

  <dialog id="new-session">
    <form method="dialog" id="new-session-form">
      <h2>New session</h2>
      <label>Where
        <select name="cwd" id="ns-cwd" required></select>
      </label>
      <label class="inline"><input type="checkbox" id="ns-new-wt"> Create a new worktree</label>
      <label id="ns-wt-name-row" hidden>Worktree name
        <input name="wtName" id="ns-wt-name" placeholder="con-1234-banner">
      </label>
      <label>Title (optional)
        <input name="title" id="ns-title">
      </label>
      <label>Permission mode
        <select name="permissionMode" id="ns-mode">
          <option value="default">default (approve tools here)</option>
          <option value="acceptEdits">acceptEdits</option>
          <option value="plan">plan</option>
          <option value="bypassPermissions">bypassPermissions</option>
        </select>
      </label>
      <label>Prompt
        <textarea name="prompt" id="ns-prompt" rows="6" required></textarea>
      </label>
      <div id="ns-attach" class="attach-row"></div>
      <div class="row">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="ok" class="primary" id="ns-submit">Start</button>
      </div>
      <div class="error" id="ns-error"></div>
    </form>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
